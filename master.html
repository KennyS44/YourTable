<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YourTable — листы игроков</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css?v=56">
<link rel="stylesheet" href="css/cabinet.css?v=56">

<!-- Версия сборки — та же, что в index.html. Поднимайте её при каждом обновлении. -->
<script type="importmap">
{
  "imports": {
    "./js/master.js":         "./js/master.js?v=56",
    "./js/charlink.js":       "./js/charlink.js?v=56",
    "./js/sheet.js":          "./js/sheet.js?v=56",
    "./js/classes.js":        "./js/classes.js?v=56",
    "./js/firebase-config.js":"./js/firebase-config.js?v=56"
  }
}
</script>
</head>
<body class="cab-body">

<div class="cab">
  <header class="topbar">
    <div class="topbar-left">
      <span class="brand">YourTable</span>
      <span class="room-name">Листы игроков</span>
    </div>
    <div class="topbar-right">
      <span class="save-mark" id="save-mark"></span>
      <a class="btn btn-ghost btn-sm" href="index.html">За стол</a>
    </div>
  </header>

  <main class="dm-stage">
    <h2 class="h-lg">Персонажи игроков</h2>
    <p class="hint dm-lead">Только чтение: лист правит игрок, у вас он обновляется сам.</p>

    <form class="dm-add" id="add-form">
      <label class="field">
        <span>Ключ персонажа</span>
        <input name="key" id="add-key" required autocomplete="off" placeholder="ABCD-2345" maxlength="9">
      </label>
      <button class="btn btn-primary" type="submit">Добавить</button>
    </form>
    <p class="gate-err" id="add-err" hidden></p>

    <div class="dm-grid" id="grid"></div>
    <p class="hint dm-empty" id="empty">Пока никого. Попросите игрока продиктовать ключ персонажа — он написан у него в листе, в кабинете.</p>

    <div class="sheet-wrap" id="sheet-wrap" hidden>
      <div class="sheet-head-row">
        <h3 class="h-lg" id="open-name"></h3>
        <button class="btn btn-ghost btn-sm" id="btn-close">Свернуть лист</button>
      </div>
      <div class="sheet" id="sheet"></div>
    </div>
  </main>
</div>

<script type="module" src="js/master.js?v=56"></script>
</body>
</html>
