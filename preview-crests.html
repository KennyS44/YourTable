<title>Гербы классов — цвет фона</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171613; --bg-2:#1e1c18; --line:#38332b; --text:#ece6d9; --muted:#a49a87;
    --gold:#c9a45a; --gold-dim:#8d7440;
    --s3:12px; --s4:16px; --s6:24px; --s8:32px;
    --f-head:"Cinzel", Georgia, serif; --f-body:"Inter", system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:var(--s8) var(--s4) 80px; background:var(--bg); color:var(--text);
    font-family:var(--f-body); font-size:16px; line-height:1.5;
  }
  h1{
    font-family:var(--f-head); font-weight:600; font-size:24px; text-align:center;
    letter-spacing:.02em; margin:0 0 var(--s3);
  }
  p.lead{ text-align:center; color:var(--muted); max-width:620px; margin:0 auto var(--s8); }
  .note{
    max-width:640px; margin:0 auto var(--s8); padding:var(--s3) var(--s4);
    border:1px solid var(--line); border-radius:10px; background:var(--bg-2);
    color:var(--muted); font-size:14px;
  }
  .variant{ max-width:960px; margin:0 auto var(--s8); padding-top:var(--s6); border-top:1px solid var(--line); }
  .variant:first-of-type{ border-top:none; padding-top:0; }
  .variant h2{
    font-family:var(--f-head); font-weight:600; font-size:18px; color:var(--gold);
    text-align:center; letter-spacing:.04em; text-transform:uppercase; margin:0 0 var(--s6);
  }
  .grid{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:var(--s6) var(--s4);
  }
  .crest{ margin:0; display:flex; flex-direction:column; align-items:center; gap:var(--s3) }
  .crest svg{ width:100%; max-width:200px; filter:drop-shadow(0 8px 20px rgba(0,0,0,.5)); }
  .crest figcaption{
    font-family:var(--f-head); font-weight:600; text-transform:uppercase;
    letter-spacing:.06em; font-size:14px; color:var(--gold); text-align:center;
  }
  @media (max-width:720px){ .grid{ grid-template-columns:repeat(2, 1fr); } }
</style>
</head>

<h1>Гербы классов — варианты фона</h1>
<p class="lead">Кант остаётся золотым, рисунок — чёрным (--ink приложения). Три варианта фона, чтобы чёрное читалось. Выбери один — остальные уберу.</p>
<div class="note">Иконки — Lorc и Delapouite, game-icons.net, лицензия CC BY 3.0. Страница временная.</div>
